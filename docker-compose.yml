
services:
  db:
    image: mysql:8.0
    container_name: e_barangay_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: e_barangay
      MYSQL_USER: barangay_user
      MYSQL_PASSWORD: e_barangay
      MYSQL_ROOT_PASSWORD: local_root_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/config/e_barangay_database.sql:/docker-entrypoint-initdb.d/01-database.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-plocal_root_password"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: e_barangay_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.docker
    ports:
      - "3000:3000"
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
