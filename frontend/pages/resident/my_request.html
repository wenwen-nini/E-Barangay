<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resident Portal</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/components/sidebar.css">
    <link rel="stylesheet" href="../../css/pages/resident/my_request.css">
</head>
<body>
    
    <app-navbar></app-navbar>

    <main>
        <header>
            <div class="introduction">
                <p>Resident Portal / My Requests</p>
                <h1>My Requests</h1>
                <p>Track of all your document requests</p>
            </div>
            <button id="new-request"><img src="../../assets/icons/General Icons/+ icon.png"> New Request</button>
        </header>
        <section class="filter-rows">
            <button class="filter-btns" id="all">All</button>
            <button class="filter-btns" id="pending">Pending</button>
            <button class="filter-btns" id="Processing">Processing</button>
            <button class="filter-btns" id="Approved">Approved</button>
            <button class="filter-btns" id="Released">Released</button>
            <button class="filter-btns" id="Rejected">Rejected</button>
        </section>
        <section class="request-list-layout">
            <div id="request-cards-container"></div>

            
            <dialog id="request-modal" class="request-modal">

                <div class="modal-header">
                    <div>
                        <h2 id="modal-title"></h2>
                        <p id="modal-description"></p>
                    </div>

                    <button type="button" id="close-modal">
                        &times;
                    </button>
                </div>

                <div class="modal-body">

                    <div id="modal-request-info"></div>

                    <div id="modal-notice"></div>

                    <form id="modal-form">
                        <div id="modal-content"></div>

                        <div class="modal-footer">
                            <button type="button" id="cancel-modal">
                                Cancel
                            </button>

                            <button type="submit" id="modal-submit">
                                Submit
                            </button>
                        </div>
                    </form>

                </div>

            </dialog>


            <div class="request-timeline">
                <div id="timeline-header">
                    <h3 id="timeline-request-number">Request #</h3>
                    <p id="timeline-document-name"></p>
                </div>

                <div class="timeline-list"></div>
            </div>
        </section>
    </main>

    <script type="module" src="../../js/components/sidebar.js"></script>
    <script type="module" src="../../js/pages/resident/my-request.js"></script>
</body>
</html>
