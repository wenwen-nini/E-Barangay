<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resident Portal</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/components/sidebar.css">
    <link rel="stylesheet" href="../../css/pages/resident/overview.css">
</head>
<body>

    <app-navbar></app-navbar>

    <main>
        <header>
            <div class="introduction"></div>
            <app-timestamp></app-timestamp>
        </header>
        <section class="request-summary">
            <h1>My Request Summary</h1>
            <div class="status-card-container"></div>
        </section>
        <section class="recent-requests">
            <div class="card-header-line">
                <h1>Recent Requests</h1>
                <a href="../resident/my_request.html">View all →</a>
            </div>
            <div class="request-list"></div>
        </section>
        <section class="notification">
            <div class="card-header-line">
                <h1>Notifications</h1>
                <a href="../resident/notification.html">View all →</a>
            </div>
            <div class="notifications"></div>
        </section>
        <section class="announcement">
            <div class="card-header-line">
                <h1>Barangay Announcements</h1>
                <a href="../resident/announcement.html">View all →</a>
            </div>
           <div class="announcements"></div>
        </section>
        <section class="quick-action">
            <div class="quick-action-item">
                <h2>Need another document?</h2>
                <p>Browse available services and review the requirements before submitting a request.</p>
                <button id="quick-action">Browse Document Catalog →</button>
            </div>
        </section>
    </main>

    <!-- Component Script -->
    <script type="module" src="../../js/components/sidebar.js"></script>
    <script type="module" src="../../js/components/timestamp.js"></script>

    <!-- Page Logic Script -->
    <script type="module" src="../../js/pages/resident/overview.js"></script>
</body>
</html>
